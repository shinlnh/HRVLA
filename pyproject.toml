[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hrvla"
version = "0.1.0"
description = "Recovery-aware planning and evaluation for humanoid VLA systems"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
gpu = [
  "torch>=2.7",
  "transformers>=4.57",
  "accelerate>=1.10",
  "bitsandbytes==0.50.2",
]
plots = ["matplotlib>=3.8"]

[project.scripts]
hrvla-subtask = "hrvla_subtask.cli:main"
hrvla-recovery = "hrvla_subtask.recovery_cli:main"
hrvla-bench = "hrvla_bench.cli:main"
hrvla-score = "hrvla_bench.score:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
