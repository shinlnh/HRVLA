[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hrvla-subtask"
version = "0.1.0"
description = "Closed-loop world-model-guided subtask planning for GR00T + SONIC"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
gpu = ["torch>=2.7", "transformers>=4.57", "accelerate>=1.10"]
plots = ["matplotlib>=3.8"]

[project.scripts]
hrvla-subtask = "hrvla_subtask.cli:main"
hrvla-recovery = "hrvla_subtask.recovery_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
